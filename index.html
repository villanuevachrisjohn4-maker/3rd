<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Monthsary ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Georgia, serif;
}

body {
  background: #ffdbe5;
  min-height: 100vh;
  overflow: hidden;
}

/* CENTER */
.container {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* ENVELOPE */
.envelope {
  width: 320px;
  height: 220px;
  position: relative;
  cursor: pointer;
}

/* Disable pointer blocking */
.envelope * {
  pointer-events: none;
}

.envelope-back {
  position: absolute;
  inset: 0;
  background: #f4a7b9;
  border-radius: 12px;
  z-index: 1;
}

/* FLAP */
.envelope-flap {
  position: absolute;
  inset: 0;
  background: #f09fb2;
  clip-path: polygon(0 0, 100% 0, 50% 60%);
  transform-origin: top;
  transition: transform 1s ease, opacity 0.6s ease;
  z-index: 4;
}

.envelope-front {
  position: absolute;
  inset: 0;
  background: #f7b7c8;
  clip-path: polygon(0 0, 100% 0, 50% 55%);
  z-index: 3;
}

.heart-seal {
  position: absolute;
  top: 48%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 26px;
  z-index: 5;
}

/* CARD */
.card-wrapper {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  transform: translateY(50px);
  transition: transform 1.2s ease;
  z-index: 2;
}

.card {
  width: 90%;
  background: linear-gradient(180deg, #fff0f5, #ffe3ec);
  padding: 24px 22px;
  border-radius: 14px;
  border: 2px solid #f2a7ba;
  box-shadow: 0 10px 25px rgba(231, 84, 128, 0.25);
}

.card h1 {
  text-align: center;
  color: #d94a73;
  margin-bottom: 14px;
  font-size: 22px;
}

.card-body {
  font-size: 15px;
  line-height: 1.8;
  color: #6b2d3e;
  min-height: 260px;
  word-wrap: break-word;
}

/* OPEN STATE */
.envelope.open .envelope-flap {
  transform: rotateX(-180deg);
  opacity: 0;
}

.envelope.open .card-wrapper {
  transform: translateY(-280px);
}

/* CURSOR */
.type::after {
  content: " |";
  color: #d94a73;
  animation: blink 1s infinite;
}

@keyframes blink {
  50% { opacity: 0; }
}

/* HEARTS */
#hearts span {
  position: fixed;
  bottom: -20px;
  animation: float 6s linear forwards;
}

@keyframes float {
  to { transform: translateY(-120vh); opacity: 0; }
}

/* SPARKLES */
#sparkles span {
  position: fixed;
  width: 6px;
  height: 6px;
  background: white;
  border-radius: 50%;
  animation: sparkle 2.5s linear forwards;
}

@keyframes sparkle {
  to {
    transform: translateY(-120px) scale(1.5);
    opacity: 0;
  }
}

/* MOBILE */
@media (max-width: 480px) {
  .card {
    padding: 20px 18px;
  }

  .card-body {
    font-size: 14.5px;
    line-height: 1.85;
  }

  .card h1 {
    font-size: 20px;
  }
}
</style>
</head>

<body>

<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="container">
  <div class="envelope" id="envelope">
    <div class="envelope-back"></div>

    <div class="card-wrapper">
      <div class="card">
        <h1>❤️ Monthsary</h1>
        <div class="card-body" id="text" data-text="
Three months may not seem like a long time, but to me, it already feels like we’ve built something really special.

In just a short time, you’ve become someone I look forward to every day—someone who makes my ordinary moments feel brighter and my heavy days feel lighter.

Thank you for being patient with me, for understanding me, and for choosing me even when things aren’t perfect.

If this is just the beginning, then I can’t wait to see how much more we’ll grow together. I choose you now and forever. ❤️
"></div>
      </div>
    </div>

    <div class="envelope-front"></div>
    <div class="envelope-flap"></div>
    <div class="heart-seal">❤️</div>
  </div>
</div>

<div id="hearts"></div>
<div id="sparkles"></div>

<script>
const envelope = document.getElementById("envelope");
const textBox = document.getElementById("text");
const music = document.getElementById("music");

let opened = false;

/* TAP ANYWHERE ON ENVELOPE */
["click", "touchstart"].forEach(e => {
  envelope.addEventListener(e, () => {
    if (opened) return;
    opened = true;

    envelope.classList.add("open");
    music.play().catch(()=>{});
    setTimeout(typeText, 800);
  });
});

/* TYPE EFFECT */
function typeText() {
  const text = textBox.dataset.text.trim();
  textBox.innerHTML = "";
  textBox.classList.add("type");

  let i = 0;
  function type() {
    if (i < text.length) {
      textBox.innerHTML += text[i] === "\n" ? "<br><br>" : text[i];
      i++;
      setTimeout(type, 28);
    } else {
      textBox.classList.remove("type");
    }
  }
  type();
}

/* HEARTS */
setInterval(() => {
  const h = document.createElement("span");
  h.innerHTML = "❤️";
  h.style.left = Math.random() * 100 + "vw";
  h.style.fontSize = Math.random() * 10 + 14 + "px";
  document.getElementById("hearts").appendChild(h);
  setTimeout(() => h.remove(), 6000);
}, 700);

/* SPARKLES */
setInterval(() => {
  const s = document.createElement("span");
  s.style.left = Math.random() * 100 + "vw";
  s.style.top = Math.random() * 100 + "vh";
  document.getElementById("sparkles").appendChild(s);
  setTimeout(() => s.remove(), 2500);
}, 300);
</script>

</body>
</html>
